<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAO 方案工作台详细页面</title>
  <style>
    :root {
      --bg: #edf4ef;
      --panel: #fbfdfb;
      --panel-2: #f5f9f6;
      --ink: #12201a;
      --muted: #66756d;
      --line: #cfddd4;
      --green: #0f7a4d;
      --green-2: #0e8f62;
      --blue: #2563eb;
      --cyan: #0ea5a4;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 18px 50px rgba(24, 48, 36, 0.14);
      --soft-shadow: 0 10px 30px rgba(24, 48, 36, 0.10);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 10%, rgba(14, 165, 164, 0.16), transparent 31%),
        linear-gradient(135deg, #e7f1eb 0%, #f7fbf8 46%, #e8f1ec 100%);
    }
    button, input, select { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 86px 1fr;
    }
    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 26px 16px;
      background: rgba(246, 250, 247, 0.94);
      border-right: 1px solid rgba(183, 204, 193, 0.72);
      backdrop-filter: blur(18px);
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(145deg, #0e7a4b, #0ea5a4);
      box-shadow: 0 16px 28px rgba(15, 122, 77, 0.28);
      font-size: 18px;
      font-weight: 950;
    }
    .rail-button {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 17px;
      color: #22332b;
      background: transparent;
    }
    .rail-button svg { width: 25px; height: 25px; stroke-width: 2; }
    .rail-button.active {
      color: var(--green);
      background: #e5f3ec;
      border-color: #b7d8c6;
      box-shadow: inset 0 0 0 1px rgba(15, 122, 77, 0.08);
    }
    .workspace {
      min-width: 0;
      padding: 22px 26px 30px;
    }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .kicker {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    .mode-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(251, 253, 251, 0.78);
      box-shadow: var(--soft-shadow);
    }
    .mode-switch button {
      height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      color: #405148;
      background: transparent;
      font-weight: 900;
      white-space: nowrap;
    }
    .mode-switch button.active {
      color: #fff;
      background: var(--green);
      box-shadow: 0 10px 22px rgba(15, 122, 77, 0.24);
    }
    .actions { display: flex; align-items: center; gap: 10px; }
    .ghost-action, .danger-action, .primary-action {
      height: 46px;
      padding: 0 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 950;
      white-space: nowrap;
    }
    .ghost-action {
      color: #33473c;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }
    .danger-action {
      color: #b42318;
      border: 1px solid #f4c7c3;
      background: #fff5f5;
    }
    .primary-action {
      color: #fff;
      border: 0;
      background: linear-gradient(145deg, #0f7a4d, #0e8f62);
      box-shadow: 0 16px 28px rgba(15, 122, 77, 0.24);
    }
    .card {
      border: 1px solid rgba(198, 215, 204, 0.92);
      border-radius: 22px;
      background: rgba(251, 253, 251, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-pad { padding: 18px; }
    .card-header {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.64);
    }
    .card-title {
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 950;
      letter-spacing: 0;
    }
    .card-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.45;
    }
    .badge {
      height: 27px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 9px;
      color: var(--green);
      background: #e7f6ed;
      font-size: 11px;
      font-weight: 950;
      white-space: nowrap;
    }
    .badge.blue { color: var(--blue); background: #eff6ff; }
    .badge.amber { color: #8a5200; background: #fff7ed; }
    .badge.red { color: #b42318; background: #fff5f5; }
    .scenario-layout {
      display: grid;
      grid-template-columns: 270px minmax(760px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .flow-steps {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .step {
      position: relative;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      align-items: center;
      min-height: 64px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8fbf8;
    }
    .step.active {
      border-color: #93c9ae;
      background: #e8f6ef;
      box-shadow: inset 0 0 0 1px rgba(15, 122, 77, 0.08);
    }
    .step-num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--green);
      background: #e4f3eb;
      font-weight: 950;
    }
    .step strong { display: block; margin-bottom: 2px; font-size: 14px; font-weight: 950; }
    .step span { color: var(--muted); font-size: 12px; font-weight: 750; }
    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 28px;
      bottom: -11px;
      width: 2px;
      height: 10px;
      background: #bdd2c6;
    }
    .mini-status {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #405148;
      font-size: 12px;
      font-weight: 850;
    }
    .status-line strong { color: var(--ink); }
    .source-tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f4f8f5;
    }
    .source-tabs button {
      height: 32px;
      border: 0;
      border-radius: 10px;
      padding: 0 12px;
      color: #4e6258;
      background: transparent;
      font-weight: 900;
      white-space: nowrap;
    }
    .source-tabs button.active { color: #fff; background: var(--green); }
    .scenario-main {
      display: grid;
      gap: 18px;
    }
    .canvas {
      position: relative;
      height: 308px;
      background:
        linear-gradient(90deg, rgba(16, 86, 57, 0.055) 1px, transparent 1px),
        linear-gradient(0deg, rgba(16, 86, 57, 0.055) 1px, transparent 1px),
        linear-gradient(180deg, #f8fbf8, #eef5f0);
      background-size: 32px 32px, 32px 32px, auto;
    }
    .chip {
      position: absolute;
      z-index: 2;
      min-width: 106px;
      padding: 9px 10px;
      border: 1px solid rgba(180, 207, 193, 0.94);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 24px rgba(18, 32, 26, 0.12);
      backdrop-filter: blur(10px);
    }
    .chip b {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #2e4438;
      font-size: 11px;
      font-weight: 950;
    }
    .chip strong { font-size: 18px; font-weight: 950; }
    .chip small { color: var(--muted); font-weight: 800; }
    .chip.in { left: 44px; top: 162px; }
    .chip.an { left: 206px; top: 62px; }
    .chip.ax { left: 386px; top: 58px; }
    .chip.ox { left: 570px; top: 58px; }
    .chip.sc { right: 82px; top: 88px; }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .panel-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .form-card, .metric, .data-card {
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #f8fbf8;
    }
    .form-card { padding: 14px; }
    .form-card h3, .data-card h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 950;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 104px;
      gap: 12px;
      align-items: center;
      min-height: 42px;
      border-bottom: 1px solid #dce8e0;
      font-size: 13px;
      font-weight: 850;
    }
    .form-row:last-child { border-bottom: 0; }
    .input-like, .select-like {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 9px;
      border: 1px solid #cadbd1;
      border-radius: 9px;
      background: #fff;
      font-weight: 950;
      white-space: nowrap;
    }
    .select-like { justify-content: space-between; }
    .metric {
      min-height: 76px;
      padding: 12px;
    }
    .metric label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }
    .metric strong { font-size: 22px; font-weight: 950; }
    .metric small { color: var(--muted); font-weight: 750; }
    .data-card { padding: 14px; }
    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #dce8e0;
      text-align: left;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      background: #f1f6f2;
      font-weight: 950;
    }
    td { font-weight: 800; }
    tr:last-child td { border-bottom: 0; }
    .notice {
      padding: 12px;
      border: 1px solid #f7d49c;
      border-radius: 15px;
      color: #7c4a03;
      background: #fff8eb;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 750;
    }
    .library-layout {
      display: grid;
      grid-template-columns: 300px minmax(680px, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }
    .path-card {
      display: grid;
      gap: 12px;
    }
    .path-node {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8fbf8;
    }
    .path-node.active {
      border-color: #93c9ae;
      background: #e8f6ef;
    }
    .path-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--green);
      background: #e4f3eb;
      font-weight: 950;
    }
    .path-node strong { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 950; }
    .path-node span { display: block; color: var(--muted); font-size: 12px; font-weight: 750; }
    .library-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .search-box {
      height: 38px;
      min-width: 280px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--muted);
      background: #fff;
      font-weight: 750;
    }
    .scenario-list {
      display: grid;
      gap: 12px;
      padding: 18px;
    }
    .scenario-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f8fbf8;
    }
    .scenario-card.active {
      border-color: #8bc8aa;
      background: linear-gradient(180deg, #e8f6ef, #f8fbf8);
      box-shadow: inset 0 0 0 1px rgba(15, 122, 77, 0.08);
    }
    .scenario-card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 950;
    }
    .scenario-card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .storage-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      align-items: center;
      border-bottom: 1px solid #dce8e0;
      color: #405148;
      font-size: 12px;
      font-weight: 850;
    }
    .storage-line:last-child { border-bottom: 0; }
    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    @media (max-width: 1280px) {
      .library-layout { grid-template-columns: 280px 1fr; }
      .library-layout .side { grid-column: 1 / -1; }
      .scenario-layout { grid-template-columns: 250px 1fr; }
      .content-grid { grid-template-columns: 1fr; }
      .panel-grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const screen = new URLSearchParams(location.search).get("screen") || "library";
    const stepMeta = [
      ["boundary", "边界来源", "手动 / CSV"],
      ["dimensions", "池体尺寸", "体积、回流、SRT"],
      ["control", "控制边界", "DO、RAS、WAS"],
      ["strategy", "运行策略", "天数、输出间隔"],
      ["overlay", "结果叠加", "指标与单体曲线"]
    ];
    const contentTitles = {
      library: ["Scenario Library", "方案库"],
      dimensions: ["Scenario Simulation", "方案仿真 · 池体尺寸"],
      control: ["Scenario Simulation", "方案仿真 · 控制边界"],
      strategy: ["Scenario Simulation", "方案仿真 · 运行策略"],
      overlay: ["Scenario Simulation", "方案仿真 · 结果叠加"],
      csv: ["Scenario Simulation", "方案仿真 · CSV 历史"],
      realtime: ["Scenario Simulation", "方案仿真 · 从实时复制"]
    };
    const activeStep = {
      dimensions: "dimensions",
      control: "control",
      strategy: "strategy",
      overlay: "overlay",
      csv: "boundary",
      realtime: "boundary"
    };
    function iconSvg(type) {
      const icons = {
        cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3 4 7.4v9.2L12 21l8-4.4V7.4L12 3Z"/><path d="M4 7.4 12 12l8-4.6"/><path d="M12 12v9"/></svg>',
        doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>',
        chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V5"/><path d="M20 19H4"/><path d="M8 16V9"/><path d="M13 16V6"/><path d="M18 16v-4"/></svg>',
        db: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 7c0-2 3.1-3.5 7-3.5S19 5 19 7s-3.1 3.5-7 3.5S5 9 5 7Z"/><path d="M5 7v5c0 2 3.1 3.5 7 3.5s7-1.5 7-3.5V7"/><path d="M5 12v5c0 2 3.1 3.5 7 3.5s7-1.5 7-3.5v-5"/></svg>',
        gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.1 2.1 0 0 1-2.97 2.97l-.04-.04a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.09 1.65V21a2.1 2.1 0 0 1-4.2 0v-.06A1.8 1.8 0 0 0 8.4 19.3a1.8 1.8 0 0 0-1.98.36l-.04.04a2.1 2.1 0 0 1-2.97-2.97l.04-.04A1.8 1.8 0 0 0 3.8 14.7 1.8 1.8 0 0 0 2.15 13H2a2.1 2.1 0 0 1 0-4.2h.06A1.8 1.8 0 0 0 3.7 7.7a1.8 1.8 0 0 0-.36-1.98l-.04-.04a2.1 2.1 0 1 1 2.97-2.97l.04.04a1.8 1.8 0 0 0 1.98.36h.01A1.8 1.8 0 0 0 9.4 1.5V1.4a2.1 2.1 0 0 1 4.2 0v.06a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 1.98-.36l.04-.04a2.1 2.1 0 1 1 2.97 2.97l-.04.04a1.8 1.8 0 0 0-.36 1.98v.01A1.8 1.8 0 0 0 21 8.8h.1a2.1 2.1 0 0 1 0 4.2h-.06A1.8 1.8 0 0 0 19.4 15Z"/></svg>'
      };
      return icons[type];
    }
    function rail(active = "doc") {
      return `<aside class="rail" aria-label="主导航">
        <div class="brand-mark">AA</div>
        ${["cube", "doc", "chart", "db", "gear"].map(type => `<div class="rail-button ${active === type ? "active" : ""}">${iconSvg(type)}</div>`).join("")}
      </aside>`;
    }
    function topbar(kicker, title, center = "", actions = "") {
      return `<header class="topbar">
        <div><p class="kicker">${kicker}</p><h1>${title}</h1></div>
        ${center || '<div></div>'}
        ${actions || '<div class="actions"><button class="ghost-action">保存方案</button><button class="primary-action">运行仿真</button></div>'}
      </header>`;
    }
    function flowNav(active = "boundary") {
      return `<aside class="card card-pad">
        <p class="card-title">方案流程</p>
        <p class="card-subtitle">每一步只处理一类问题，运行前统一校验。</p>
        <div class="flow-steps">
          ${stepMeta.map(([id, name, desc], index) => `<div class="step ${active === id ? "active" : ""}"><div class="step-num">${index + 1}</div><div><strong>${name}</strong><span>${desc}</span></div></div>`).join("")}
        </div>
        <div class="mini-status">
          <div class="status-line"><span>当前方案</span><strong>雨季高负荷方案</strong></div>
          <div class="status-line"><span>保存位置</span><strong>项目数据库</strong></div>
          <div class="status-line"><span>数据状态</span><strong>已通过</strong></div>
          <div class="status-line"><span>解算器</span><strong>RK4 v2</strong></div>
        </div>
      </aside>`;
    }
    function sourceTabs(active) {
      return `<div class="source-tabs">
        <button class="${active === "manual" ? "active" : ""}">手动边界</button>
        <button class="${active === "csv" ? "active" : ""}">CSV 历史</button>
        <button class="${active === "realtime" ? "active" : ""}">从实时复制</button>
      </div>`;
    }
    function miniMap(kind = "dims") {
      const chips = {
        dims: [
          ["in", "IN 进水", "Q", "10000", "m3/d"],
          ["an", "AN 厌氧", "V", "1800", "m3"],
          ["ax", "AX 缺氧", "V", "2600", "m3"],
          ["ox", "OX 好氧", "V", "5200", "m3"],
          ["sc", "SC 二沉池", "H", "4.2", "m"]
        ],
        control: [
          ["in", "IN 进水", "Q", "10000", "m3/d"],
          ["an", "AN 厌氧", "IR", "120%", ""],
          ["ax", "AX 缺氧", "RAS", "80%", ""],
          ["ox", "OX 好氧", "DO", "2.0", "g/m3"],
          ["sc", "SC 二沉池", "WAS", "350", "m3/d"]
        ],
        overlay: [
          ["in", "IN 进水", "NH4", "32.0", "g/m3"],
          ["an", "AN 厌氧", "NH4", "29.4", "g/m3"],
          ["ax", "AX 缺氧", "NH4", "17.8", "g/m3"],
          ["ox", "OX 好氧", "NH4", "2.1", "g/m3"],
          ["sc", "OUT 出水", "NH4", "0.42", "g/m3"]
        ],
        copy: [
