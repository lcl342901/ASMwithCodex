<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地下污水厂一线 3D 流程示意</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1014;
        --panel: rgba(13, 20, 25, 0.86);
        --line: rgba(178, 207, 218, 0.24);
        --text: #edf6f7;
        --muted: #9fb5bb;
        --cyan: #3dd6e8;
        --red: #ff4d4d;
        --amber: #f1c45c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button {
        font: inherit;
      }

      #scene {
        position: fixed;
        inset: 0;
      }

      .panel {
        pointer-events: auto;
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.34);
      }

      .title-panel {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: min(740px, calc(100vw - 460px));
        min-width: 420px;
        border-radius: 8px;
        padding: 11px 18px;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 14px;
      }

      .app-nav {
        position: fixed;
        top: 16px;
        left: 18px;
        z-index: 7;
        display: flex;
        gap: 6px;
        padding: 7px;
        border-radius: 8px;
      }

      .app-nav a {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(157, 195, 205, 0.24);
        border-radius: 6px;
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        text-decoration: none;
        font-size: 12px;
        white-space: nowrap;
      }

      .app-nav a:hover,
      .app-nav a.active {
        border-color: rgba(61, 214, 232, 0.7);
        background: rgba(61, 214, 232, 0.18);
      }

      .eyebrow {
        margin: 0;
        color: var(--cyan);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.2;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .toolbar {
        position: fixed;
        left: 18px;
        top: 88px;
        width: 186px;
        max-height: calc(100vh - 120px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-radius: 8px;
        padding: 14px;
        overflow: auto;
      }

      .status-panel {
        position: fixed;
        top: 88px;
        right: 18px;
        width: 340px;
        max-height: calc(100vh - 120px);
        border-radius: 8px;
        padding: 16px;
        overflow: auto;
      }

      .view-button,
      .toggle-button {
        min-height: 34px;
        border: 1px solid rgba(157, 195, 205, 0.24);
        border-radius: 6px;
        padding: 7px 11px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        cursor: pointer;
      }

      .view-button:hover,
      .toggle-button:hover,
      .view-button.active,
      .toggle-button.active {
        border-color: rgba(61, 214, 232, 0.7);
        background: rgba(61, 214, 232, 0.18);
      }

      .status-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .status-header h2 {
        margin: 0;
        font-size: 18px;
      }

      .badge {
        border: 1px solid rgba(241, 196, 92, 0.58);
        border-radius: 999px;
        padding: 4px 9px;
        color: var(--amber);
        font-size: 12px;
        white-space: nowrap;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        min-width: 0;
        border: 1px solid rgba(178, 207, 218, 0.16);
        border-radius: 7px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.045);
      }

      .metric small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .metric strong {
        display: block;
        margin-top: 5px;
        font-size: 15px;
        line-height: 1.25;
      }

      .unit-note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .legend {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        width: min(760px, calc(100vw - 40px));
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 18px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .swatch {
        width: 18px;
        height: 8px;
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .label {
        position: fixed;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 5px 8px;
        background: rgba(8, 12, 15, 0.78);
        color: #eaf8fa;
        font-size: 12px;
        pointer-events: none;
        white-space: nowrap;
      }

      @media (max-width: 980px) {
        .title-panel {
          top: 58px;
          min-width: 0;
          width: calc(100vw - 24px);
          justify-content: flex-start;
        }

        .app-nav {
          top: 12px;
          left: 12px;
          right: 12px;
          overflow-x: auto;
        }

        .toolbar {
          top: 120px;
          left: 12px;
          width: min(220px, calc(100vw - 24px));
          max-height: 42vh;
        }

        .status-panel {
          top: auto;
          right: 12px;
          bottom: 12px;
          width: min(340px, calc(100vw - 24px));
          max-height: 38vh;
        }

        h1 {
          font-size: 17px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="地下污水厂一条线 3D 工艺流程"></canvas>

    <nav class="panel app-nav" aria-label="平台导航">
      <a href="../asm-platform/index.html">返回平台</a>
      <a href="wwtp-3d.html">AAO 3D</a>
      <a class="active" href="underground-line-3d.html">地下流程</a>
    </nav>

    <section class="panel title-panel">
      <p class="eyebrow">UNDERGROUND WWTP LINE</p>
      <h1>地下污水厂一条线 3D 工艺流程</h1>
    </section>

    <nav class="panel toolbar" aria-label="视角与图层控制">
      <button class="view-button active" data-view="overview" type="button">总览</button>
      <button class="view-button" data-view="pretreat" type="button">进水/预处理</button>
      <button class="view-button" data-view="bio" type="button">多级 AO</button>
      <button class="view-button" data-view="secondary" type="button">二沉池</button>
      <button class="view-button" data-view="advanced" type="button">深度处理</button>
      <button class="view-button" data-view="effluent" type="button">出水</button>
      <button class="toggle-button active" data-toggle="arrows" type="button">流向箭头</button>
      <button class="toggle-button active" data-toggle="roof" type="button">上部格栅</button>
      <button class="toggle-button active" data-toggle="labels" type="button">标签</button>
    </nav>

    <aside class="panel status-panel">
      <div class="status-header">
        <div>
          <p class="eyebrow">SELECTED PROCESS</p>
          <h2 id="selectedName">多级 AO 生物池</h2>
        </div>
        <span id="selectedBadge" class="badge">8 条廊道</span>
      </div>
      <div class="metric-grid">
        <div class="metric"><small>位置</small><strong id="metricPosition">生物处理</strong></div>
        <div class="metric"><small>结构</small><strong id="metricStructure">厌氧-缺氧-好氧-缺氧-好氧</strong></div>
        <div class="metric"><small>水流</small><strong id="metricFlow">单线连续流</strong></div>
        <div class="metric"><small>表达重点</small><strong id="metricFocus">廊道与回折流向</strong></div>
      </div>
      <p id="unitNote" class="unit-note">这是根据口述工艺做的 3D 示意，用于验证流程关系和空间表达，不代表精确施工尺寸。</p>
    </aside>

    <div class="panel legend" aria-label="图例">
      <span class="legend-item"><i class="swatch" style="background:#ff4d4d"></i>红色箭头：主流程方向</span>
      <span class="legend-item"><i class="swatch" style="background:#31bed0"></i>蓝色水面：处理水流</span>
      <span class="legend-item"><i class="swatch" style="background:#f1c45c"></i>黄色分隔：工艺分区/廊道</span>
      <span class="legend-item"><i class="swatch" style="background:#dfe7e8"></i>白色网格：地下厂房上部格栅</span>
    </div>

    <div id="hoverLabel" class="label" hidden></div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const canvas = document.querySelector("#scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1014);
      scene.fog = new THREE.Fog(0x0b1014, 90, 230);

      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(38, 48, 82);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 0, 0);
      controls.maxPolarAngle = Math.PI * 0.49;

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const clickables = [];
      const labelSprites = [];
      const arrowGroup = new THREE.Group();
      const roofGroup = new THREE.Group();
      const labelGroup = new THREE.Group();
      scene.add(arrowGroup, roofGroup, labelGroup);

      const units = {
        inlet: {
          name: "进水泵房",
          badge: "进水系统",
          position: "进水端",
          structure: "地下泵房",
          flow: "原水提升",
          focus: "抬升水位",
          note: "原水先经进水泵房提升，进入后续中细格栅。"
        },
        screen: {
          name: "中细格栅",
          badge: "预处理",
          position: "进水后",
          structure: "格栅渠",
          flow: "去除大颗粒杂物",
          focus: "渠道分配",
          note: "示意为多条窄渠，表达粗细格栅合建或紧邻布置。"
        },
        grit: {
          name: "曝气沉砂池",
          badge: "预处理",
          position: "格栅后",
          structure: "曝气沉砂",
          flow: "去除砂粒",
          focus: "气提/沉砂",
          note: "位于格栅之后、初沉池之前。"
        },
        primary: {
          name: "初沉池",
          badge: "一级处理",
          position: "预处理末端",
          structure: "矩形池",
          flow: "沉降悬浮物",
          focus: "进出水配水",
          note: "初沉池后进入多级 AO 生物池。"
        },
        bio: {
          name: "多级 AO 生物池",
          badge: "8 条廊道",
          position: "生物处理",
          structure: "厌氧-缺氧-好氧-缺氧-好氧",
          flow: "廊道回折流",
          focus: "五段分区",
          note: "按一组 8 条廊道示意，流向在廊道中多次折返。"
        },
        secondary: {
          name: "二沉池",
          badge: "8 条廊道",
          position: "生物池后",
          structure: "一组 8 条廊道",
          flow: "泥水分离",
          focus: "成组廊道",
          note: "你描述的一条线对应一组，这一组对应 8 条廊道。"
        },
        hdc: {
          name: "高密池",
          badge: "4 格",
          position: "二沉池后",
          structure: "一座四格",
          flow: "混凝沉淀",
          focus: "四格分区",
          note: "一座高密池内部按 4 格表达。"
        },
        dnf: {
          name: "反硝化滤池",
          badge: "两组",
          position: "高密池后",
          structure: "一座两组",
          flow: "深度脱氮过滤",
          focus: "两组滤池",
          note: "一座反硝化滤池按两组并列表达。"
        },
        effluent: {
          name: "出水渠",
          badge: "出水系统",
          position: "末端",
          structure: "出水渠",
          flow: "达标排放",
          focus: "最终出水",
          note: "深度处理后进入出水系统。"
        }
      };

      const mat = {
        floor: new THREE.MeshStandardMaterial({ color: 0x263034, roughness: 0.92 }),
        wall: new THREE.MeshStandardMaterial({ color: 0x9aa3a2, roughness: 0.82 }),
        wallDark: new THREE.MeshStandardMaterial({ color: 0x5f6d70, roughness: 0.86 }),
        water: new THREE.MeshPhysicalMaterial({ color: 0x31bed0, transparent: true, opacity: 0.52, roughness: 0.2, transmission: 0.12, thickness: 0.6 }),
        bioAnaerobic: new THREE.MeshStandardMaterial({ color: 0x1b8a96, transparent: true, opacity: 0.58 }),
        bioAnoxic: new THREE.MeshStandardMaterial({ color: 0x2aa87a, transparent: true, opacity: 0.58 }),
        bioAerobic: new THREE.MeshStandardMaterial({ color: 0x36c7dd, transparent: true, opacity: 0.58 }),
        divider: new THREE.MeshStandardMaterial({ color: 0xf1c45c, roughness: 0.55 }),
        roof: new THREE.MeshStandardMaterial({ color: 0xdfe7e8, roughness: 0.38, metalness: 0.2 }),
        arrow: new THREE.MeshStandardMaterial({ color: 0xff4d4d, roughness: 0.35, emissive: 0x5d0909, emissiveIntensity: 0.28 }),
        highlight: new THREE.MeshStandardMaterial({ color: 0x3dd6e8, transparent: true, opacity: 0.3, emissive: 0x176979, emissiveIntensity: 0.35 })
      };

      function addLights() {
        scene.add(new THREE.HemisphereLight(0xd9fbff, 0x1d2528, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(30, 70, 38);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -110;
        sun.shadow.camera.right = 110;
        sun.shadow.camera.top = 140;
        sun.shadow.camera.bottom = -140;
        scene.add(sun);
      }

      function box(w, h, d, material) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function addGround() {
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 190), mat.floor);
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -6;
        ground.receiveShadow = true;
        scene.add(ground);

        const frame = box(68, 0.7, 142, mat.wallDark);
        frame.position.set(0, 0.36, -4);
        scene.add(frame);
      }

      function addTank({ key, name, x, z, w, d, waterMat = mat.water, depth = 3.8 }) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);
        group.name = name;

        const floor = box(w, 0.5, d, mat.wallDark);
        floor.position.y = 0.25;
        group.add(floor);

        const t = 0.35;
        [
          { x: 0, z: -d / 2, w, d: t },
          { x: 0, z: d / 2, w, d: t },
          { x: -w / 2, z: 0, w: t, d },
          { x: w / 2, z: 0, w: t, d }
        ].forEach((wall) => {
          const mesh = box(wall.w, depth, wall.d, mat.wall);
          mesh.position.set(wall.x, depth / 2 + 0.5, wall.z);
          group.add(mesh);
        });

        const water = box(w - 0.9, 0.18, d - 0.9, waterMat.clone());
        water.position.y = depth + 0.45;
        group.add(water);

        const hit = box(w, depth, d, mat.highlight.clone());
        hit.position.y = depth / 2 + 0.5;
        hit.visible = false;
        hit.userData = { key, name, highlight: hit };
        group.add(hit);
        clickables.push(hit, water);

        scene.add(group);
        addLabel(name, new THREE.Vector3(x, depth + 2.0, z));
        return group;
      }

      function addSmallChannels(key, name, x, z, w, d, channels) {
        const group = addTank({ key, name, x, z, w, d, depth: 3.1 });
        const spacing = w / channels;
        for (let i = 1; i < channels; i += 1) {
          const divider = box(0.12, 2.7, d - 0.7, mat.divider);
          divider.position.set(-w / 2 + i * spacing, 2.1, 0);
          group.add(divider);
        }
      }

      function addBioTank() {
        const x = 0;
        const z = -8;
        const w = 44;
        const d = 54;
        const group = addTank({ key: "bio", name: "多级 AO 生物池", x, z, w, d, depth: 4.2 });

        const laneCount = 8;
        const laneW = (w - 1.0) / laneCount;
        for (let i = 1; i < laneCount; i += 1) {
          const divider = box(0.12, 4.0, d - 0.8, mat.divider);
          divider.position.set(-w / 2 + 0.5 + i * laneW, 2.7, 0);
          group.add(divider);
        }

        const zones = [
          { name: "厌氧", z: 19.5, d: 8, material: mat.bioAnaerobic },
          { name: "缺氧 1", z: 10.5, d: 8, material: mat.bioAnoxic },
          { name: "好氧 1", z: -1, d: 14, material: mat.bioAerobic },
          { name: "缺氧 2", z: -13.5, d: 8, material: mat.bioAnoxic },
          { name: "好氧 2", z: -23, d: 9, material: mat.bioAerobic }
        ];
        zones.forEach((zone) => {
          const zoneMesh = box(w - 1.0, 0.12, zone.d, zone.material.clone());
          zoneMesh.position.set(0, 4.85, zone.z);
          group.add(zoneMesh);
          addLabel(zone.name, new THREE.Vector3(x, 7.4, z + zone.z));
        });

        addRoofGrid(x, z, w, d, 8, 13);
        addSerpentineArrows(x, z, w, d, laneCount);
      }

      function addSecondary() {
        const group = addTank({ key: "secondary", name: "二沉池", x: 0, z: -52, w: 44, d: 24, depth: 3.8 });
        const laneCount = 8;
        const laneW = 43 / laneCount;
        for (let i = 1; i < laneCount; i += 1) {
          const divider = box(0.12, 3.5, 23, mat.divider);
          divider.position.set(-22 + i * laneW, 2.5, 0);
          group.add(divider);
        }
        addRoofGrid(0, -52, 44, 24, 8, 6);
      }

      function addAdvanced() {
        const hdc = addTank({ key: "hdc", name: "高密池", x: -12, z: -87, w: 24, d: 18, depth: 3.7 });
        [-6, 6].forEach((dx) => {
          const divider = box(0.12, 3.4, 17, mat.divider);
          divider.position.set(dx, 2.45, 0);
          hdc.add(divider);
        });
        const cross = box(23, 3.4, 0.12, mat.divider);
        cross.position.set(0, 2.45, 0);
        hdc.add(cross);

        const dnf = addTank({ key: "dnf", name: "反硝化滤池", x: 15, z: -87, w: 22, d: 18, depth: 3.7 });
        const divider = box(0.12, 3.4, 17, mat.divider);
        divider.position.set(0, 2.45, 0);
        dnf.add(divider);

        addRoofGrid(-12, -87, 24, 18, 4, 4);
        addRoofGrid(15, -87, 22, 18, 2, 4);
      }

      function addRoofGrid(x, z, w, d, cols, rows) {
        const y = 5.4;
        for (let i = 0; i <= cols; i += 1) {
          const bar = box(0.12, 0.12, d, mat.roof);
          bar.position.set(x - w / 2 + (w * i) / cols, y, z);
          roofGroup.add(bar);
        }
        for (let j = 0; j <= rows; j += 1) {
          const bar = box(w, 0.12, 0.12, mat.roof);
          bar.position.set(x, y, z - d / 2 + (d * j) / rows);
          roofGroup.add(bar);
        }
      }

      function addArrow(start, end, width = 0.45) {
        const from = new THREE.Vector3(...start);
        const to = new THREE.Vector3(...end);
        const dir = new THREE.Vector3().subVectors(to, from);
        const length = dir.length();
        const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
        dir.normalize();

        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(width * 0.22, width * 0.22, Math.max(0.1, length - 1.2), 12), mat.arrow);
        shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        shaft.position.copy(mid).addScaledVector(dir, -0.45);
        shaft.castShadow = true;
        arrowGroup.add(shaft);

        const head = new THREE.Mesh(new THREE.ConeGeometry(width, 1.25, 18), mat.arrow);
        head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        head.position.copy(to);
        head.castShadow = true;
        arrowGroup.add(head);
      }

      function addSerpentineArrows(x, z, w, d, lanes) {
        const laneW = (w - 4) / lanes;
        for (let i = 0; i < lanes; i += 1) {
          const lx = x - w / 2 + 2 + laneW * (i + 0.5);
          const fromZ = i % 2 === 0 ? z + d / 2 - 3 : z - d / 2 + 3;
          const toZ = i % 2 === 0 ? z - d / 2 + 3 : z + d / 2 - 3;
          addArrow([lx, 6.0, fromZ], [lx, 6.0, toZ], 0.45);
          if (i < lanes - 1) {
            const nextX = lx + laneW;
            addArrow([lx, 6.0, toZ], [nextX, 6.0, toZ], 0.38);
          }
        }
      }

      function addProcessArrows() {
        addArrow([-5, 5.7, 64], [-5, 5.7, 54], 0.5);
        addArrow([5, 5.7, 54], [5, 5.7, 43], 0.5);
        addArrow([0, 5.7, 35], [0, 5.7, 24], 0.5);
        addArrow([0, 5.7, 17], [0, 5.7, 5], 0.5);
        addArrow([0, 5.8, -35], [0, 5.8, -43], 0.55);
        addArrow([0, 5.8, -65], [-12, 5.8, -78], 0.48);
        addArrow([-2, 5.8, -87], [5, 5.8, -87], 0.48);
        addArrow([25, 5.8, -87], [34, 5.8, -87], 0.48);
      }

      function addLabel(text, position) {
        const sprite = makeTextSprite(text);
        sprite.position.copy(position);
        labelGroup.add(sprite);
        labelSprites.push(sprite);
      }

      function makeTextSprite(text) {
        const c = document.createElement("canvas");
        c.width = 300;
        c.height = 76;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "rgba(8,12,15,0.78)";
        ctx.strokeStyle = "rgba(255,255,255,0.24)";
        ctx.lineWidth = 2;
        roundRect(ctx, 8, 8, 284, 56, 8);
        ctx.fill();
        ctx.stroke();
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#edf6f7";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 150, 36);
        const texture = new THREE.CanvasTexture(c);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
        sprite.scale.set(8.2, 2.1, 1);
        return sprite;
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function buildScene() {
        addLights();
        addGround();
        addSmallChannels("inlet", "进水泵房", -10, 62, 16, 12, 3);
        addSmallChannels("screen", "中细格栅", 10, 50, 18, 14, 5);
        addTank({ key: "grit", name: "曝气沉砂池", x: -8, z: 34, w: 18, d: 13, depth: 3.3 });
        addTank({ key: "primary", name: "初沉池", x: 8, z: 18, w: 24, d: 16, depth: 3.6 });
        addBioTank();
        addSecondary();
        addAdvanced();
        addTank({ key: "effluent", name: "出水渠", x: 38, z: -87, w: 10, d: 18, depth: 2.6 });
        addProcessArrows();
      }

      function setSelected(key) {
        const unit = units[key] || units.bio;
        document.querySelector("#selectedName").textContent = unit.name;
        document.querySelector("#selectedBadge").textContent = unit.badge;
        document.querySelector("#metricPosition").textContent = unit.position;
        document.querySelector("#metricStructure").textContent = unit.structure;
        document.querySelector("#metricFlow").textContent = unit.flow;
        document.querySelector("#metricFocus").textContent = unit.focus;
        document.querySelector("#unitNote").textContent = unit.note;
        clickables.forEach((obj) => {
          if (obj.userData.highlight) obj.visible = obj.userData.key === key;
        });
      }

      function moveCamera(position, target) {
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const endPos = new THREE.Vector3(...position);
        const endTarget = new THREE.Vector3(...target);
        const started = performance.now();
        const duration = 750;
        function step(now) {
          const t = Math.min((now - started) / duration, 1);
          const k = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(startPos, endPos, k);
          controls.target.lerpVectors(startTarget, endTarget, k);
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      const views = {
        overview: { position: [38, 48, 82], target: [0, 0, -10], selected: "bio" },
        pretreat: { position: [24, 30, 82], target: [0, 2, 42], selected: "screen" },
        bio: { position: [46, 34, 28], target: [0, 2, -8], selected: "bio" },
        secondary: { position: [38, 30, -22], target: [0, 2, -52], selected: "secondary" },
        advanced: { position: [32, 30, -118], target: [4, 2, -87], selected: "hdc" },
        effluent: { position: [58, 20, -96], target: [34, 2, -87], selected: "effluent" }
      };

      document.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-view]").forEach((b) => b.classList.remove("active"));
          button.classList.add("active");
          const view = views[button.dataset.view];
          moveCamera(view.position, view.target);
          setSelected(view.selected);
        });
      });

      document.querySelectorAll("[data-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          button.classList.toggle("active");
          const visible = button.classList.contains("active");
          if (button.dataset.toggle === "arrows") arrowGroup.visible = visible;
          if (button.dataset.toggle === "roof") roofGroup.visible = visible;
          if (button.dataset.toggle === "labels") labelGroup.visible = visible;
        });
      });

      function pick(event, commit) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickables, false);
        const label = document.querySelector("#hoverLabel");
        if (hits.length) {
          const item = hits[0].object.userData;
          label.hidden = false;
          label.textContent = item.name;
          label.style.left = `${event.clientX}px`;
          label.style.top = `${event.clientY - 18}px`;
          if (commit && item.key) setSelected(item.key);
        } else {
          label.hidden = true;
        }
      }

      renderer.domElement.addEventListener("pointermove", (event) => pick(event, false));
      renderer.domElement.addEventListener("click", (event) => pick(event, true));

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      buildScene();
      setSelected("bio");
      animate();
    </script>
  </body>
</html>
